<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Tinder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="tinder-page">
    <div class="tinder-shell">
        <header class="tinder-header">
            <a href="index.html">TINDER</a>
        </header>

        <main class="tinder-main">
            <section class="tinder-login">

    <p class="terms-text">
        Ao tocar em "Continuar", você concorda com nossos
        <a href="#termos">Termos</a>.
        Saiba como processamos seus dados em nossa
        <a href="#privacidade">Política de Privacidade</a> e
        <a href="#cookies">Política de Cookies</a>.
    </p>

    <form class="tinder-form" action="#login" method="get">
        <button class="login-button" type="submit" name="metodo" value="google">
            Continuar com o Google
        </button>

        <button class="login-button" type="submit" name="metodo" value="telefone">
            Continuar com número de telefone
        </button>

        <button class="login-button" type="submit" name="metodo" value="email">
            Continuar com e-mail
        </button>
    </form>

</section>
